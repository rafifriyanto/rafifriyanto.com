<!doctype html>
<html><head><meta charset="utf-8"><title>X banner — Rafif Riyanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="banner-core.css">
<style>
  /* X: 1500x500. Measured, not guessed: at the 600px width X renders the header
   * on a desktop profile, the avatar spans x 40-372 and y 332-500 in banner
   * coordinates. A 280px start put the tags row inside that circle and clipped
   * "BOTS", so the block begins at 400px — just clear of the avatar's right edge. */
  html,body{width:1500px;height:500px}
  :root{ --pad-x:400px; --name-size:92px; --mono-size:520px;
         --rule-w:340px; --tag-size:28px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="monogram">R</div>
  <div class="content">
    <p class="eyebrow">Medical student &middot; Automation</p>
    <h1 class="name">Rafif Riyanto</h1>
    <div class="rule"></div>
    <p class="tagline">The work that <em>shouldn&rsquo;t</em> be done by hand.</p>
    <p class="tags">
      <span>Bots</span><span class="dot"></span>
      <span>Scrapers</span><span class="dot"></span>
      <span>AI workflows</span>
    </p>
  </div>
</body></html>
