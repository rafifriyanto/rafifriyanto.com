<!doctype html>
<html><head><meta charset="utf-8"><title>OG image — Rafif Riyanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="banner-core.css">
<style>
  /* Open Graph card: 1200x630. Unlike the LinkedIn banner, nothing overlaps
   * this image — no avatar, no crop — so --pad-x drops from 450 to the plain
   * margin. Everything else inherits banner-core so the three surfaces stay
   * one design. */
  html,body{width:1200px;height:630px}
  :root{ --pad-x:96px; --name-size:82px; --mono-size:430px;
         --rule-w:320px; --tag-size:24px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="monogram">R</div>
  <div class="content">
    <p class="eyebrow">Medical student &middot; Automation</p>
    <h1 class="name">Rafif Riyanto</h1>
    <div class="rule"></div>
    <p class="tagline">The work that <em>shouldn&rsquo;t</em> be done by hand.</p>
    <p class="tags">
      <span>Bots</span><span class="dot"></span>
      <span>Scrapers</span><span class="dot"></span>
      <span>AI workflows</span>
    </p>
  </div>
</body></html>
