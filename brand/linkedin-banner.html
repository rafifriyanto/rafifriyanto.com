<!doctype html>
<html><head><meta charset="utf-8"><title>LinkedIn banner — Rafif Riyanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="banner-core.css">
<style>
  /* LinkedIn: 1584x396. Measured off the live profile, not modelled: the photo
   * occupies x 53-409 in banner coordinates — noticeably wider and further right
   * than the 24px/152px avatar the first proof sheet assumed. At --pad-x:360 it
   * clipped the tagline's first words and the "BOTS" tag. 450 clears it with
   * ~40px of air. Re-measure before narrowing this again. */
  html,body{width:1584px;height:396px}
  :root{ --pad-x:450px; --name-size:78px; --mono-size:400px;
         --rule-w:300px; --tag-size:25px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="monogram">R</div>
  <div class="content">
    <p class="eyebrow">Medical student &middot; Automation</p>
    <h1 class="name">Rafif Riyanto</h1>
    <div class="rule"></div>
    <p class="tagline">The work that <em>shouldn&rsquo;t</em> be done by hand.</p>
    <p class="tags">
      <span>Bots</span><span class="dot"></span>
      <span>Scrapers</span><span class="dot"></span>
      <span>AI workflows</span>
    </p>
  </div>
</body></html>
